name: Deploy Quartz to GitHub Pages
 
on:
  push:
    branches:
      - v4
  # --- ここから追加 ---
  schedule:
    # 毎週月曜日と木曜日の午前10時（日本時間）に実行する設定
    # UTC（世界標準時）で記述するため、日本時間から9時間引いた時間を指定します
    - cron: '0 1 * * 1,4' 
  # --- ここまで追加 ---
  workflow_dispatch: # 手動で実行ボタンを押せるようにする設定（あると便利です）

env: # これを追加
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4